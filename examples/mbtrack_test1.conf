 ## mbtrack_soleil.conf
 ##
 ## Created:  2013-03-22
 ##
 ## mpirun -n 2 mbtrack-mpi work/mbtrack_soleil.conf

 #
 # Section tracking: Tracking parameters
 #
  [tracking]
  
  # Job title
  jobtitle = SOLEIL multibunch


  # Filling pattern
  filling = ONETHIRD

  # Bunch model
  BunchModel = WEAK
  
  # Activate tracking on a given plane
  TrackPlane_LON = 1
  TrackPlane_HOR = 1
  TrackPlane_VER = 0
 
  # Total number of revolutions
  NrevTot = 10000
  
  # Multiturns for the long range force (=0,1,2,...) of RW
  # (NmultiT=Nmlt+2 is used in the program to stock CM data for all values of Nmlt)
  Nmlt = 1
  
  # Turn interval between beam diagnostics
  NrevMon = 200
  
  # Enable (1) or disable (0) Resistive Wall effect
  EnableRW_long = 1
  EnableRW_short = 0
  EnableFBII = 0
  EnableQuantum = 1
  EnableAmpinv_out = 1
  EnableActiveHC = 0
  EnableIdealHC = 0

 #
 # Section ring: Beam and Machine Parameters: 
 #
 [ring]

  #
  # Beam Energy [GeV]
  #
  E0 = 2.75
  
  #
  # Horizontal and Vertical tune
  #
  QH0 = 18.20     
  QV0 = 10.30
  
  #
  # double Lc and rho0: Machine circumf [m] and radius of curv [m]
  # (rho0 not used if U0 and taue given!)
  Lc = 354.1    
  rho0 = 5.36
  
  #
  # double betaH, betaV, dispH [m]
  #
  betaH = 8.83
  betaV = 8.63
  dispH = 0.0
  
  #
  # double alphaH, alphaV, disppH
  #
  alphaH = 0.0
  alphaV = 0.0
  disppH = 0.0
  
  #
  # double emittanceH and couplbeta:  emittanceH [nm]
  # only to calculate initial bunch lengthes
  # if emittanceV [nm] is given, couplbeta is calculated
  emittanceH = 3.72
  couplbeta  = 0.01
  
  #
  # double rhorw: Wall resistivity [Ohm m], needed if RW is enabled in section tracking
  # double beff [m] :effective beam pipe radius for RW
  # MAX IV: 430 m with b = 11.0e-3 m, 98 m with b = 13.5 m
    rhorw = 2.8e-8
    beffL1 = 1.0e-2
    beffL2 = 1.0e-2
    beffH3 = 1.0e-2
    beffH4 = 1.0e-2
    beffV3 = 1.0e-2
    beffV4 = 1.0e-2

  #
  # double ac and Je:  Momentum compaction and Longitudinal damping partition
  # (cf. Values of the low betaz optics)
  #
  ac = 0.0004380
  Je = 2.0009
  
  #
  # double Vrf0 & frf:  Total Effective RF Voltage [MV] 
  #                     & RF Frequency [MHz]
  #
  Vrf0 = 2.0
  frf  = 352.200
  
  #
  # double Ib:  Beam Current [mA]
  #
  Iring = 500
  
  #
  # double ApertureH [mm] and ApertureV [mm]:  
  #   Half aperture in the transverse planes. All macro electrons and ions 
  #   exceeding these values shall be eliminated
  #   !!! not yet used !!!
  # MAX IV: standard beam pipe: 11 mm, min taper at 10 mm
  ApertureH = 10.0
  ApertureV = 10.0

  
  #
  # double Gzix and Gziz:  Normalised chromaticities in the two planes
  # double Cx and Cz: Standard chromaticities, will be normalized by given tunes
  # MAX IV: Variation [0,2] in both planes reasonable
  Cx = 0.0
  Cz = 0.0


  #
  # Ncell: number of bins for bunch selffield calculation
  # Nsigma: binning extends over [-Nsigma, Nsigma]
  # RsisL: offset of the lon. impedance (real part) [Ohm]
  # aindL: slope offset of the lon. impedance (imag. part) [Ohm/ GHz]
  #
  [selffield]

  Ncell = 141
  Nsigma = 7
  
 #
 # Section distribution: Beam Distribution Parameters
 #
 [distribution]
  
  #
  # int Nslc : a bunch is longitudinally sliced into 2*Nslc+1 cells
  #            (strong model)
  #
  Nslc = 0
  
  #
  # int  Np:  Number of Particles (less than 30000)
  #
  Np = 1


  #
  # int nGen  &  iseed: (for each plane) 
  #
  #   cf) if nGen = 0, read the existing file (gendst_datafile[iplane]).
  #       iseed:  Seed for the Generation of Initial Gaussian Distribution
  #       iseed = 0 for the Hollow Bunch Distribution
  #
  nGen_LON  = 1
  iseed_LON = 123456
  nGen_HOR  = 1
  iseed_HOR = 542387
  nGen_VER  = 1
  iseed_VER = 115599

  #
  # char  gendst_datafile_iplane:
  #       (iplane = LON, HOR, VER ...)
  # i.e.  Filenames for the initial beam distribution.
  #
  gendst_datafile_LON = work/Ldistribution0
  gendst_datafile_HOR = work/Hdistribution0
  gendst_datafile_VER = work/Vdistribution0

  #
  # double xtauCM_offset, xepsCM_offset, sgm_xtau and sgm_xeps: 
  # i.e.  Initial CM coordinates and the beam size in the longitudinal.
  #            xtauCM_offset and sgm_xtau: [nsec]   
  #
  # <NB> By entering negative numbers for sgm_xtau and sgm_xeps,
  #      nominal values will be automatically assumed.
  # MAX IV: at 500mA sgm_xtau = 0.194
  # MAX IV: natural energy spread sgm_xeps = 7.69e-4
  xtauCM_offset = 0.0
  xepsCM_offset = 0.0
  sgm_xtau = -1.0
  sgm_xeps = -1.0
  
  #
  # double xxCM_offset, xpCM_offset, sgm_xx and sgm_xp: 
  # i.e.  Initial CM coordinates and the beam size in the horizontal.
  #            xxCM_offset and sgm_xx: [mm]   
  #
  # <NB> By entering negative numbers for sgm_xx and sgm_xp,
  #      nominal values will be automatically assumed.ampinvdata.in79
  #
  xxCM_offset = 0.0
  xpCM_offset = 0.0
  sgm_xx = -1.0 
  sgm_xp = -1.0 


  #
  # double zzCM_offset, zpCM_offset, sgm_zz and sgm_zp: 
  # i.e.  Initial CM coordinates and the beam size in the vertical.
  #            zzCM_offset and sgm_zz: [mm]   
  #
  # <NB> By entering negative numbers for sgm_zz and sgm_zp,
  #      nominal values will be automatically assumed.
  #
  sgm_zz = -1.0 
  sgm_zp = -1.0 
  
  zzCM_offset = 0.000
  zpCM_offset = 0.000

  # Current scan for bunch length curve or tune curve
  # curr_start [mA] (ring current)
  # NrevTot = (Nscan + 1) * NrevScan
  # scan_type: 1 current, 2 chroma
  [scan]
  scan_type = 0
  Nscan = 30
  NrevScan = 10000
  scan_start = 0.1
  scan_step = 0.1


